[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_dir = "cache"
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
 # Base Mainnet & Sepolia RPC endpoints
[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
eth_mainnet = "https://eth.llamarpc.com"

# Etherscan API keys (same key works for BaseScan)
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
